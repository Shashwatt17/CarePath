spring:
  datasource:
    url: jdbc:h2:mem:carepath;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:auth-h2.sql
  jpa:
    hibernate:
      ddl-auto: validate
carepath:
  reminders:
    enabled: false
  processing:
    worker-enabled: false
  auth:
    issuer: https://carepath.test
    audience: carepath-api
    access-seconds: 60
    refresh-seconds: 3600
    bcrypt-cost: 10
    cookie-secure: false
    frontend-origin: http://localhost:3000
    ip-limit: 100
    account-limit: 4
    rate-window-seconds: 60
